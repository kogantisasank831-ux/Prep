name: Weekly learning checks

on:
  push:
    branches: [main, 'week*-assessment', 'week*-content']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assessments-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            labs/week_12/requirements.txt
      - name: Require the JavaScript test runtime
        run: |
          node --version
          node -e "if (Number(process.versions.node.split('.')[0]) < 20) process.exit(1)"
      - name: Install the declared test environment
        run: python -m pip install -r requirements-dev.txt -r labs/week_12/requirements.txt
      - name: Lint, format and type checks
        run: |
          python -m ruff check tests/test_week07_assessment.py tests/test_week08_assessment.py tests/test_week09_assessment.py tests/test_week10_assessment.py tests/test_week11_assessment.py labs/week_10 tests/test_week10_tracing.py labs/week_11 tests/test_week11_security.py labs/week_12 tests/test_week12_service.py tests/test_week12_postgres.py
          python -m ruff format --check tests/test_week07_assessment.py tests/test_week08_assessment.py tests/test_week09_assessment.py tests/test_week10_assessment.py tests/test_week11_assessment.py labs/week_10 tests/test_week10_tracing.py labs/week_11 tests/test_week11_security.py labs/week_12 tests/test_week12_service.py tests/test_week12_postgres.py
          python -m mypy --strict --explicit-package-bases tests/test_week07_assessment.py tests/test_week08_assessment.py tests/test_week09_assessment.py tests/test_week10_assessment.py tests/test_week11_assessment.py labs/week_10 tests/test_week10_tracing.py labs/week_11 tests/test_week11_security.py labs/week_12 tests/test_week12_service.py tests/test_week12_postgres.py
      - name: Assessment, retrieval/assistant/evaluation/tracing lab and service regressions
        run: >-
          python -m pytest tests/test_week*_assessment.py
          tests/test_week07_hybrid.py tests/test_week08_assistant.py tests/test_week09_evaluation.py tests/test_week10_tracing.py tests/test_week11_security.py tests/test_week12_service.py tests/test_api.py tests/test_models.py
          tests/test_readers.py tests/test_service.py -q

  week12-stack:
    needs: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            labs/week_12/requirements.txt
      - name: Install the declared integration environment
        run: python -m pip install -r requirements-dev.txt -r labs/week_12/requirements.txt
      - name: Create isolated ephemeral fixture credentials
        run: python -m labs.week_12.cli secrets
      - name: Validate and build the real container stack
        run: |
          docker compose -f labs/week_12/compose.yml -f labs/week_12/compose.ci.yml config --quiet
          docker compose -f labs/week_12/compose.yml -f labs/week_12/compose.ci.yml build api
          docker image inspect prep-week12-api:local --format '{{.Id}}'
      - name: Run actual PostgreSQL pgvector and FastAPI services
        run: |
          docker compose -f labs/week_12/compose.yml -f labs/week_12/compose.ci.yml up -d --no-build api
          python -m labs.week_12.cli smoke
      - name: Required PostgreSQL permission vector and revocation integration
        env:
          W12_INTEGRATION: '1'
          W12_DB_HOST: 127.0.0.1
          W12_DB_PORT: '55432'
        run: python -m pytest tests/test_week12_postgres.py -q
      - name: Verify the named-volume restart path and server smoke
        run: |
          docker compose -f labs/week_12/compose.yml -f labs/week_12/compose.ci.yml down
          docker compose -f labs/week_12/compose.yml -f labs/week_12/compose.ci.yml up -d --no-build api
          python -m labs.week_12.cli smoke
          docker compose -f labs/week_12/compose.yml -f labs/week_12/compose.ci.yml exec -T db psql -U postgres -d rag_demo -Atc "SELECT version()"
          docker compose -f labs/week_12/compose.yml -f labs/week_12/compose.ci.yml exec -T db psql -U postgres -d rag_demo -Atc "SELECT extversion FROM pg_extension WHERE extname='vector'"
      - name: Bounded application diagnostics on failure
        if: failure()
        run: |
          docker compose -f labs/week_12/compose.yml -f labs/week_12/compose.ci.yml ps
          python - <<'PY'
          import json, urllib.request
          for path in ('/health/live','/health/ready'):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000'+path,timeout=2) as r:
                      print(json.dumps({'from':'host','path':path,'status':r.status,'body':r.read(256).decode()}))
              except Exception as error:
                  print(json.dumps({'from':'host','path':path,'type':type(error).__name__,'status':getattr(error,'code',None)}))
          PY
          docker compose -f labs/week_12/compose.yml -f labs/week_12/compose.ci.yml logs --tail=80 api bootstrap
      - name: Stop only this isolated stack
        if: always()
        run: docker compose -f labs/week_12/compose.yml -f labs/week_12/compose.ci.yml down
