name: Weekly learning checks

on:
  push:
    branches: [main, 'week*-assessment', 'week*-content']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assessments-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Require the JavaScript test runtime
        run: |
          node --version
          node -e "if (Number(process.versions.node.split('.')[0]) < 20) process.exit(1)"
      - name: Install the declared test environment
        run: python -m pip install -r requirements-dev.txt
      - name: Lint, format and type checks
        run: |
          python -m ruff check tests/test_week07_assessment.py tests/test_week08_assessment.py tests/test_week09_assessment.py tests/test_week10_assessment.py labs/week_10 tests/test_week10_tracing.py
          python -m ruff format --check tests/test_week07_assessment.py tests/test_week08_assessment.py tests/test_week09_assessment.py tests/test_week10_assessment.py labs/week_10 tests/test_week10_tracing.py
          python -m mypy --strict --explicit-package-bases tests/test_week07_assessment.py tests/test_week08_assessment.py tests/test_week09_assessment.py tests/test_week10_assessment.py labs/week_10 tests/test_week10_tracing.py
      - name: Assessment, retrieval/assistant/evaluation/tracing lab and service regressions
        run: >-
          python -m pytest tests/test_week*_assessment.py
          tests/test_week07_hybrid.py tests/test_week08_assistant.py tests/test_week09_evaluation.py tests/test_week10_tracing.py tests/test_api.py tests/test_models.py
          tests/test_readers.py tests/test_service.py -q
